<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tickethack</title>

    <!-- Tailwind CSS CDN -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  </head>

  <!-- A DEV -->
  <body>
    <!-- Header-->
    <header>
      <div id="logo">Tickethack</div>
      <div id="nav">
        <button class="btnNav">Cart</button>
        <button class="btnNav">Bookings</button>
      </div>
    </header>

    <!-- BODY -->

    <div id="container">
      <h1>Explore the world effortlessly by train!</h1>
      <p id="subtitle">
        Compare, book and enjoy cheap prices for train tickets: your journey
        starts on Tickethack.
      </p>

      <div id="formulaireContainer">
        <div class="searchCard">
          <div id="destination">
            <input id="departure" placeholder="Departure" />
            <div id="line"></div>
            <input id="arrival" placeholder="Arrival" />
            <!-- SELECTION DATE -->
          </div>
          <div id="searchDate">
            <input id="travelDate" type="date" name="travelDate" lang="fr" />
          </div>

          <button id="search-btn">Search</button>
        </div>
        <div class="searchCard">
          <div id="resultContainer">
            <div id="img-container">
            <img id="img-result" src="../images/train.png" />
          </div>
            <div id ="separetline"></div>
            <p id="resultText">It's time to book your futre trip.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
